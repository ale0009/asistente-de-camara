<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Anillo exterior hexagonal -->
  <polygon points="64,12 112,40 112,96 64,124 16,96 16,40" fill="#040a18" stroke="url(#cyber-grad)" stroke-width="6" stroke-linejoin="round"/>
  <!-- Diamante interior -->
  <polygon points="64,30 96,64 64,98 32,64" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Núcleo de estrella IA -->
  <circle cx="64" cy="64" r="16" fill="url(#core-glow)"/>
  <!-- Cruz luminosa -->
  <line x1="64" y1="46" x2="64" y2="82" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="64" x2="82" y2="64" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
